<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Lost — cd.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Bebas+Neue&display=swap" rel="stylesheet" />
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      body{min-height:100vh;background:#080808;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;text-align:center;padding:2rem;gap:1.5rem;}
      .logo{font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800;letter-spacing:-.01em;margin-bottom:.5rem;}
      .logo-c{color:#FF2D55}.logo-dot{color:#FF2D55}
      .code{font-family:'Bebas Neue',sans-serif;font-size:clamp(5rem,20vw,10rem);line-height:1;background:linear-gradient(135deg,#FF2D55,#BF5FFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
      h1{font-family:'Syne',sans-serif;font-size:clamp(1.2rem,4vw,1.8rem);font-weight:800;letter-spacing:.05em;opacity:.9;}
      p{font-size:.95rem;opacity:.45;max-width:360px;line-height:1.6;}
      a{display:inline-block;margin-top:.5rem;font-family:'Syne',sans-serif;font-size:.85rem;font-weight:700;letter-spacing:.1em;color:#000;background:linear-gradient(135deg,#00FFBD,#BF5FFF);padding:.65rem 1.8rem;border-radius:999px;text-decoration:none;transition:opacity .2s,transform .2s;}
      a:hover{opacity:.85;transform:scale(1.04);}
    </style>
  </head>
  <body>
    <div class="logo"><span class="logo-c">c</span>d<span class="logo-dot">.</span></div>
    <div class="code">404</div>
    <h1>You got a little lost.</h1>
    <p>This page doesn't exist. But the website we made for Divya does, and it's much better than this.</p>
    <a href="/">Take me home →</a>
  </body>
</html>
